{% extends 'base.html' %}

{% block content %}
<div class="form-card">
    <h2>Novo Passageiro para {{ viagem.nome }}</h2>
    <form method="POST">
        {% csrf_token %}
        <div class="form-field">
            <label for="name">Digite o nome completo do passageiro</label>
            <input id="name" name="nome" type="text" placeholder="Nome completo" required>
        </div>
        <div class="form-2parts">
            <div class="form-field">
                <label for="id">Digite o documento de identificação (CPF se for brasileiro)</label>
                <input id="id" name="documento" type="text" placeholder="Documento de identificação" required>
            </div>
            <div class="form-field">
                <label for="nacao">Digite a nacionalidade do passageiro</label>
                <input id="nacao" name="nacionalidade" type="text" placeholder="País" required>
            </div>
        </div>
        <div class="form-2parts">
            <div class="form-field">
                <label for="cellcont">Digite o telefone de contato do passageiro</label>
                <input id="cellcont" name="telefone" type="text" placeholder="Ex: (00)00000-0000" required>
            </div>
            <div class="form-field">
                <label for="born">Digite a data de nascimento do passageiro</label>
                <input id="born" name="data_nascimento" type="date" required>
            </div>
        </div>
        <div class="form-2parts">
            <div class="form-field">
                <label for="nameeme">Digite o nome do contato de emergência</label>
                <input id="nameeme" name="nome_emergencia" type="text" placeholder="Nome do contato de emergência" required>
            </div>
            <div class="form-field">
                <label for="celleme">Digite o contato de emergência do passageiro</label>
                <input id="celleme" name="telefone_emergencia" type="text" placeholder="Ex: (00)00000-0000" required>
            </div>
        </div>
        <div>
            <label for="status">O passageiro está presente?</label>
            <input id="status" name="status" type="checkbox" style="margin-bottom: 20px">
        </div>
        <button type="submit">Salvar Alterações</button>
        <a href="{% url 'detalhes_passageiro' passageiro.id %}" class="button">Cancelar</a>
    </form>
</div>
{% endblock %}
